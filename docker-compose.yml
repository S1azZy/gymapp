services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gym_app_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_app_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        RUBY_VERSION: "3.4.7"
    command: >
      bash -lc "bundle install &&
      bin/rails db:prepare &&
      bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle

volumes:
  postgres_data:
  bundle_data:
